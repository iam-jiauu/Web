<main style="padding:3rem;">
  <div class="game-box">
    <h3>🤖 Guessing Game</h3>
    <p>The machine picks a number from 1 to 100. It’s your turn to guess!</p>
    <div id="tip">Enter your guess below</div>
    <input type="number" id="userInput" placeholder="Type number" min="1" max="100">
    <button onclick="checkGuess()">Submit</button>
    <p>Guess count: <span id="cnt">0</span></p>
    <button onclick="restartGame()">Restart</button>
  </div>
</main>

<script>
let target = Math.floor(Math.random() * 100) + 1;
let count = 0;

function checkGuess(){
  const val = document.getElementById("userInput").value;
  const tipDom = document.getElementById("tip");
  const countDom = document.getElementById("cnt");
  let num = Number(val);

  if(!val || isNaN(num)){
    tipDom.innerText = "⚠️ Please enter a valid integer!";
    return;
  }
  count++;
  countDom.innerText = count;

  if(num < target){
    tipDom.innerText = "📈 Too small! Try a bigger number.";
  }else if(num > target){
    tipDom.innerText = "📉 Too big! Try a smaller number.";
  }else{
    tipDom.innerText = `🎉 Correct! The number is ${target}.`;
  }
  document.getElementById("userInput").value = "";
}

function restartGame(){
  target = Math.floor(Math.random() * 100) + 1;
  count = 0;
  document.getElementById("tip").innerText = "Enter your guess below";
  document.getElementById("cnt").innerText = "0";
  document.getElementById("userInput").value = "";
}
</script>
